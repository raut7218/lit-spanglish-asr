[project]
name = "lit-spanglish-asr"
version = "0.1.0"
description = "Whisper LoRA fine-tuning + faster-whisper inference for Lost in Transcription (Spanish-English)"
requires-python = ">=3.10"
dependencies = [
  "torch", "torchaudio", "transformers==4.57.6", "peft==0.20.0", "faster-whisper==1.2.1", "ctranslate2==4.8.2",
  "accelerate", "jiwer", "soundfile", "librosa", "numpy", "pandas", "pyyaml", "tqdm", "sentencepiece", "typer",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
