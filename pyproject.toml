[project]
name = "lit-spanglish-asr"
version = "0.1.0"
description = "Canary-1b-v2 fine-tuning + NeMo-free inference for Lost in Transcription (Spanish-English)"
requires-python = ">=3.10"
dependencies = [
  "torch", "torchaudio", "transformers==4.57.6", "safetensors", "sentencepiece", "huggingface_hub",
  "jiwer", "soundfile", "librosa", "numpy", "pandas", "pyyaml", "typer",  # typer: scripts/official_score.py
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
