# Colab Pro A100/L4 (bf16). Whisper large-v3 (32 encoder + 32 decoder layers): best accuracy.
model: openai/whisper-large-v3
language: es
data_dir: /content/data_prepared
out_dir: /content/drive/MyDrive/lit_runs/large_v3_a100
dtype: bf16
lora: {r: 32, alpha: 64, dropout: 0.05, targets: [q_proj, k_proj, v_proj, out_proj, fc1, fc2]}
lr: 1.0e-4
warmup_steps: 100
batch_size: 8
grad_accum: 4
epochs: 3
eval_steps: 100
save_steps: 50
keep_best: 3
eval_batch_size: 16
num_workers: 4
